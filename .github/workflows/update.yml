name: Update Sing-box Rule

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build rule sets
        env:
          SING_BOX_OUTPUT_DIR: ${{ runner.temp }}/rule-output
        run: python scripts/update.py

      - name: Force publish to sing-box branch
        run: |
          set -euxo pipefail

          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          git checkout --orphan sing-box
          git rm -rf -f . >/dev/null 2>&1 || true
          git clean -fdx -e .git >/dev/null 2>&1 || true

          cp -R "$RUNNER_TEMP/rule-output/." .

          git add -A
          git commit -m "Auto update sing-box rules [skip ci]"

          git push --force origin HEAD:sing-box
